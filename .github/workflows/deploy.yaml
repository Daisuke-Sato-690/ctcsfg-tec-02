name: push-image
on:
  push:
    branches: [main]
 
permissions:
  id-token: write
  contents: read
 
env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: ctc-zk-t2-2026-app
 
jobs:
  push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::825382393140:role/ctc-zk-t2-2026-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
 
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
 
      - name: Build & push
        run: |
          REPO=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}
          docker build -t $REPO:${GITHUB_SHA} -t $REPO:latest .
          docker push $REPO:${GITHUB_SHA}
          docker push $REPO:latest